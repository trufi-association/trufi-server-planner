name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Dart
      uses: dart-lang/setup-dart@v1
      with:
        sdk: stable

    - name: Install dependencies
      run: dart pub get

    - name: Build Docker image
      run: docker build -t trufi-server-planner:test .

    - name: Stage runtime mounts for tests
      run: |
        # data/ and web/ are gitignored — populate from the committed example
        # feed and a placeholder so the container can resolve both at runtime.
        mkdir -p data web
        cp example.gtfs.zip data/gtfs.zip
        # Test 'Web app serves HTML' looks for the substring "Trufi".
        echo '<!doctype html><title>Trufi Server Planner</title>' > web/index.html

    - name: Start server
      run: |
        # docker-compose mounts ./data and ./web in production; CI mirrors
        # that since the Dockerfile intentionally does not bake either into
        # the image (so the same image works for any city via volume mount).
        docker run -d -p 9090:8080 --name trufi-test \
          -v "${{ github.workspace }}/data:/app/data:ro" \
          -v "${{ github.workspace }}/web:/app/web:ro" \
          trufi-server-planner:test
        sleep 20

    - name: Run integration tests
      run: dart test test/integration_test.dart

    - name: Run plan handler tests
      # Loads example.gtfs.zip in-process and calls the handler directly;
      # needs no container, so a Docker failure above must not skip it.
      if: success() || failure()
      run: dart test test/plan_handler_test.dart

    - name: Show server logs on failure
      if: failure()
      run: docker logs trufi-test

    - name: Stop server
      if: always()
      run: docker stop trufi-test && docker rm trufi-test
